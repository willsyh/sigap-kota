<style>
        /* Subtle Teal Map Pattern Background */
        .bg-pattern-map {
            background-color: #f9f9ff;
            background-image: radial-gradient(#00535b 0.5px, transparent 0.5px), radial-gradient(#00535b 0.5px, #f9f9ff 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            opacity: 0.05;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="antialiased bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Ambient Background Pattern -->
<div class="absolute inset-0 bg-pattern-map z-0 pointer-events-none"></div>
<!-- Main Container -->
<main class="w-full max-w-md px-container-padding-mobile md:px-0 relative z-10">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-stack-lg shadow-[0px_2px_12px_rgba(0,109,119,0.05)] w-full border border-outline-variant/30">
<!-- Header / Logo -->
<div class="text-center mb-stack-lg">
<img class="h-20 mx-auto object-contain mb-stack-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCNj5MSzwTMkrpGepIIEJX3bsgK8EdojldmOGUASbOSS5Bklex79WQkF6JMTB863FvEcUPtFdAPPVV5_AgU72lpzpl1xinOljRBiqDbnmNolbDTmTQmvIPMp80KhWyKuToOMWk_WjNI01vxUqCRN44UDoS5HG1eGrBFycwBWgu5oB_KGDPy_ow9eiw-v94_VNe3cB-qVa1O2JdDPf87HG12ylx3X4ifcSIyjukxR-AZFoXBXVAeXXzd1g"/>
<h1 class="font-headline-md text-headline-md text-on-surface">Sign in to your account</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-stack-sm">Access the civic utility platform</p>
</div>
<!-- Form -->
<form action="#" class="space-y-stack-md" method="POST">
<!-- Email Input -->
<div class="space-y-stack-sm">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-colors outline-none placeholder:text-outline-variant" id="email" name="email" placeholder="citizen@city.gov" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-stack-sm">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-colors outline-none placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full mt-stack-lg h-12 flex items-center justify-center bg-primary text-on-primary rounded-lg font-label-bold text-label-bold hover:bg-primary-container transition-colors active:scale-[0.98]" type="submit">
                    Log in
                </button>
</form>
<!-- Divider -->
<div class="mt-stack-lg mb-stack-md flex items-center justify-center">
<span class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? <a class="text-primary font-label-bold hover:underline" href="#">Sign up</a>
</span>
</div>
<div class="relative py-stack-sm">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/50"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest text-outline font-label-md text-label-md">OR</span>
</div>
</div>
<!-- Secondary Action -->
<button class="w-full mt-stack-sm h-12 flex items-center justify-center bg-transparent border border-primary text-primary rounded-lg font-label-bold text-label-bold hover:bg-surface-variant/30 transition-colors active:scale-[0.98]" type="button">
                Continue as guest
            </button>
</div>
</main>
</body></html>
