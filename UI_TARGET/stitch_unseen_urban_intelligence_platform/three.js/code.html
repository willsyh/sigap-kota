<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_2 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_2" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_2');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 15, 25);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0x404040, 2);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x00E5FF, 2, 50);
pointLight.position.set(5, 10, 5);
scene.add(pointLight);

// City Elements: Low-poly buildings and districts
const buildingMaterial = new THREE.MeshPhongMaterial({
    color: 0x1A1A1A,
    transparent: true,
    opacity: 0.8,
    wireframe: false
});

const wireframeMaterial = new THREE.MeshBasicMaterial({
    color: 0x00E5FF,
    transparent: true,
    opacity: 0.2,
    wireframe: true
});

function createBuilding(x, z, h, w, d) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mesh = new THREE.Mesh(geo, buildingMaterial);
    mesh.position.set(x, h/2, z);
    scene.add(mesh);

    const wire = new THREE.Mesh(geo, wireframeMaterial);
    wire.position.set(x, h/2, z);
    scene.add(wire);
}

// Generate a small city block
for(let i = -10; i <= 10; i += 4) {
    for(let j = -10; j <= 10; j += 4) {
        if(Math.random() > 0.3) {
            const h = Math.random() * 5 + 2;
            createBuilding(i, j, h, 2, 2);
        }
    }
}

// Ground plane
const groundGeo = new THREE.PlaneGeometry(50, 50);
const groundMat = new THREE.MeshPhongMaterial({ 
    color: 0x050505, 
    transparent: true, 
    opacity: 0.5 
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Animation Loop
function animate() {
    requestAnimationFrame(animate);
    
    // Subtle camera movement
    const time = Date.now() * 0.0005;
    camera.position.x = Math.sin(time * 0.2) * 5;
    camera.lookAt(0, 0, 0);
    
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_2 -->
</body>
</html>
