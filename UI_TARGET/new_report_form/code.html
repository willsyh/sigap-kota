<body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen">

</button>
<h1 class="ml-2 font-headline-md text-headline-md font-bold text-on-surface">Report an issue</h1>
</header>

<div class="max-w-[600px] mx-auto w-full p-gutter flex flex-col gap-stack-lg mt-stack-md">

<span class="material-symbols-outlined text-outline">photo_camera</span>

</button>

<div class="absolute top-2 right-2">
<button class="bg-surface shadow-md rounded-full px-3 py-1.5 flex items-center gap-1.5 text-primary hover:bg-surface-variant/50 transition-colors border border-outline-variant/20">

<span class="font-label-md text-label-md font-bold">Use my current location</span>
